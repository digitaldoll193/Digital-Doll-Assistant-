<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Doll Assistant — Customer Dashboard</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: #10182c;
      --panel-2: #151f38;
      --text: #ffffff;
      --muted: #aeb9d8;
      --blue: #1687ff;
      --pink: #ff4fc8;
      --green: #37d67a;
      --danger: #ff5d6c;
      --border: rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(22,135,255,.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(255,79,200,.12), transparent 30%),
        var(--bg);
    }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 26px 0 50px;
    }

    .topbar {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: clamp(25px, 4vw, 40px);
    }

    .brand p {
      margin: 0;
      color: var(--muted);
    }

    .status {
      border: 1px solid rgba(55,214,122,.35);
      color: var(--green);
      background: rgba(55,214,122,.08);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr);
      gap: 20px;
    }

    .card {
      background: linear-gradient(180deg, rgba(21,31,56,.96), rgba(12,18,34,.96));
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(0,0,0,.32);
      overflow: hidden;
    }

    .card-head {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,.025);
    }

    .card-head h2 {
      margin: 0 0 5px;
      font-size: 21px;
    }

    .card-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card-body { padding: 22px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: #dce4ff;
      font-size: 13px;
      font-weight: 700;
    }

    .field { margin-bottom: 15px; }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(4,8,18,.72);
      color: var(--text);
      border-radius: 13px;
      padding: 13px 14px;
      outline: none;
      font: inherit;
    }

    textarea { resize: vertical; min-height: 92px; }

    input:focus, textarea:focus, select:focus {
      border-color: rgba(22,135,255,.85);
      box-shadow: 0 0 0 3px rgba(22,135,255,.14);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      border: 0;
      border-radius: 13px;
      padding: 12px 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, var(--blue), #7757ff);
      color: white;
    }

    .secondary {
      background: rgba(255,255,255,.08);
      color: white;
      border: 1px solid var(--border);
    }

    .danger {
      background: rgba(255,93,108,.12);
      color: #ff98a3;
      border: 1px solid rgba(255,93,108,.25);
    }

    .notice {
      display: none;
      margin-bottom: 16px;
      border-radius: 13px;
      padding: 12px 14px;
      font-size: 14px;
    }

    .notice.ok {
      display: block;
      color: #bdf4d3;
      background: rgba(55,214,122,.1);
      border: 1px solid rgba(55,214,122,.25);
    }

    .notice.error {
      display: block;
      color: #ffd1d5;
      background: rgba(255,93,108,.1);
      border: 1px solid rgba(255,93,108,.25);
    }

    .customer-list {
      display: grid;
      gap: 12px;
    }

    .empty {
      color: var(--muted);
      padding: 14px 0;
    }

    .customer {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      border-radius: 16px;
      padding: 15px;
    }

    .customer-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .customer h3 {
      margin: 0 0 6px;
      font-size: 17px;
    }

    .customer p {
      margin: 3px 0;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }

    .pill {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(22,135,255,.12);
      color: #94c9ff;
      font-size: 11px;
      font-weight: 800;
    }

    .embed {
      margin-top: 12px;
      background: #050812;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      color: #dbe7ff;
      font-family: monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .small-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .small-actions button {
      padding: 8px 11px;
      font-size: 12px;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 620px) {
      .row { grid-template-columns: 1fr; gap: 0; }
      .card-body, .card-head { padding: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>Digital Doll Assistant</h1>
        <p>Customer onboarding and chatbot management</p>
      </div>
      <div class="status">● Admin Build</div>
    </header>

    <section class="grid">
      <article class="card">
        <div class="card-head">
          <h2>Add a customer</h2>
          <p>Create the business profile Nova will use.</p>
        </div>

        <div class="card-body">
          <div id="notice" class="notice"></div>

          <form id="customerForm">
            <div class="row">
              <div class="field">
                <label for="businessName">Business name *</label>
                <input id="businessName" name="businessName" required />
              </div>

              <div class="field">
                <label for="industry">Industry *</label>
                <select id="industry" name="industry" required>
                  <option value="">Select industry</option>
                  <option>Plumbing</option>
                  <option>Real Estate</option>
                  <option>Healthcare</option>
                  <option>Legal</option>
                  <option>Beauty / Salon</option>
                  <option>Home Services</option>
                  <option>Professional Services</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label for="ownerName">Owner/contact name *</label>
                <input id="ownerName" name="ownerName" required />
              </div>

              <div class="field">
                <label for="leadEmail">Lead notification email *</label>
                <input id="leadEmail" name="leadEmail" type="email" required />
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label for="phone">Business phone</label>
                <input id="phone" name="phone" type="tel" />
              </div>

              <div class="field">
                <label for="website">Website</label>
                <input id="website" name="website" type="url" placeholder="https://..." />
              </div>
            </div>

            <div class="row">
              <div class="field">
                <label for="businessHours">Business hours</label>
                <input id="businessHours" name="businessHours" placeholder="Mon–Fri, 9 AM–5 PM" />
              </div>

              <div class="field">
                <label for="calendarUrl">Calendar/booking link</label>
                <input id="calendarUrl" name="calendarUrl" type="url" placeholder="https://..." />
              </div>
            </div>

            <div class="field">
              <label for="services">Services and pricing</label>
              <textarea id="services" name="services" placeholder="List the services, prices, service areas, and important details Nova should know."></textarea>
            </div>

            <div class="field">
              <label for="faqs">Frequently asked questions</label>
              <textarea id="faqs" name="faqs" placeholder="Example: Do you offer emergency service? Yes, 24/7."></textarea>
            </div>

            <div class="field">
              <label for="greeting">Chatbot greeting</label>
              <textarea id="greeting" name="greeting">Hello! I’m your AI business assistant. How can I help you today?</textarea>
            </div>

            <div class="actions">
              <button class="primary" type="submit">Save customer</button>
              <button class="secondary" type="reset">Clear form</button>
            </div>
          </form>
        </div>
      </article>

      <aside class="card">
        <div class="card-head">
          <h2>Customers</h2>
          <p>Saved businesses and installation codes.</p>
        </div>

        <div class="card-body">
          <div id="customerList" class="customer-list">
            <div class="empty">No customers have been added yet.</div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const form = document.getElementById("customerForm");
    const customerList = document.getElementById("customerList");
    const notice = document.getElementById("notice");

    function showNotice(message, type) {
      notice.textContent = message;
      notice.className = "notice " + type;
    }

    function escapeHtml(value = "") {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function customerCard(customer) {
      const embedCode =
        '<script src="' +
        window.location.origin +
        '/widget.js" data-api="' +
        window.location.origin +
        '" data-customer-id="' +
        customer.id +
        '"><\\/script>';

      return `
        <div class="customer" data-id="${escapeHtml(customer.id)}">
          <div class="customer-top">
            <div>
              <h3>${escapeHtml(customer.businessName)}</h3>
              <p>${escapeHtml(customer.ownerName)} · ${escapeHtml(customer.leadEmail)}</p>
              <p>${escapeHtml(customer.industry || "Other")}</p>
            </div>
            <span class="pill">${escapeHtml(customer.id)}</span>
          </div>

          <div class="embed">${escapeHtml(embedCode)}</div>

          <div class="small-actions">
            <button class="secondary" type="button" data-copy="${escapeHtml(embedCode)}">Copy install code</button>
            <button class="danger" type="button" data-delete="${escapeHtml(customer.id)}">Delete</button>
          </div>
        </div>
      `;
    }

    async function loadCustomers() {
      try {
        const response = await fetch("/api/customers");
        if (!response.ok) throw new Error("Could not load customers.");

        const customers = await response.json();

        customerList.innerHTML = customers.length
          ? customers.map(customerCard).join("")
          : '<div class="empty">No customers have been added yet.</div>';
      } catch (error) {
        customerList.innerHTML =
          '<div class="empty">The customer API is not connected yet. We will connect it in server.js next.</div>';
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const customer = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch("/api/customers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(customer)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.message || "Customer could not be saved.");
        }

        showNotice("Customer saved successfully.", "ok");
        form.reset();
        await loadCustomers();
      } catch (error) {
        showNotice(error.message, "error");
      }
    });

    customerList.addEventListener("click", async (event) => {
      const copyButton = event.target.closest("[data-copy]");
      const deleteButton = event.target.closest("[data-delete]");

      if (copyButton) {
        await navigator.clipboard.writeText(copyButton.dataset.copy);
        copyButton.textContent = "Copied";
        setTimeout(() => (copyButton.textContent = "Copy install code"), 1500);
      }

      if (deleteButton) {
        const id = deleteButton.dataset.delete;
        const confirmed = confirm("Delete this customer?");
        if (!confirmed) return;

        const response = await fetch("/api/customers/" + encodeURIComponent(id), {
          method: "DELETE"
        });

        if (response.ok) {
          showNotice("Customer deleted.", "ok");
          await loadCustomers();
        } else {
          showNotice("Customer could not be deleted.", "error");
        }
      }
    });

    loadCustomers();
  </script>
</body>
</html>
